{% extends "base.html" %}

{% block content %}
<div class="row">
    {% include "dashboard/sidebar.html" %}
   
    <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center">
         <h2>All Category</h2>
         <a class="btn btn-warning float-right mb-2"  href="{% url 'add_category' %}" >Add new</a>
         </div>
         <table class="table table-hover">
            <thead>
             <tr>
                <th>#</th>
                <th>Category</th>
                <th>Created_at</th>
                <th>Updated_at</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                 <tr>
                    <td>{{cat.id}}</th>
                    <td>{{cat.category_name}}</td>
                    <td>{{cat.created_at}}</td>
                    <td>{{cat.updated_at}}</td>
                    <td>
                        <a href="{% url 'edit_category' cat.id %}"><i class="fa fa-edit text-primary" ></i></a>
                        &nbsp;
                        <a href="{% url 'delete_category' cat.id %}"><i class="fa fa-trash text-danger" aria-hidden="true" href=""></i></a>
                    </td>
                </tr>
                {% endfor %}
          
   
  </tbody>
</table>
    </div>

</div>

{% endblock %}
