{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
{% include "dashboard/sidebar.html" %}

    <div class="col-md-9">
        {% if perms.auth.view_user %}
        <h2>Edit User</h2>
        <form action="{% url 'edit_user' user_obj.id %}" method="POST" >
            {% csrf_token %}
            {{form | crispy}}
            <button type="submit" class="btn btn-warning mb-2">Submit</button>
        </form>
        {% else %}
        <h2>You do not have permissions</h2>
        {% endif %}
    </div>
</div>
{% endblock %}
