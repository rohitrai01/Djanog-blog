{% extends "base.html" %}

{% block content %}
<div class="row">
    {% include "dashboard/sidebar.html" %}
   
    <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center">
         <h2>All Post</h2>
         <a class="btn btn-warning float-right mb-2"  href="{% url 'add_blog' %}" >Add new</a>
         </div>
         <table class="table table-hover">
            <thead>
             <tr>
                <th>#</th>
                <th>Title</th>
                <th>Category</th>
                <th>Author</th>
                <th>Status</th>
                <th>Is_featured</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
                {% for b in blogs %}
                 <tr>
                    <td>{{b.id}}</th>
                    <td>{{b.title}}</td>
                    <td>{{b.category}}</td>
                    <td>{{b.author}}</td>
                    <td>{{b.status}}</td>
                    <td>{{b.is_featured}}</td>
                    <td>
                        <a href="{% url 'edit_blog' b.id %}"><i class="fa fa-edit text-primary" ></i></a>
                        &nbsp;
                        <a href="{% url 'delete_blog' b.id %}"><i class="fa fa-trash text-danger" aria-hidden="true" href=""></i></a>
                    </td>
                </tr>
                {% endfor %}
          
   
  </tbody>
</table>
    </div>

</div>

{% endblock %}
